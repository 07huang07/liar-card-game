<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Card Game Hub V5.0</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#55331f,#170e09 65%);color:#fff}
    .hub{width:min(980px,92vw);padding:30px;border:1px solid #4b413b;border-radius:26px;background:rgba(15,15,15,.92);box-shadow:0 20px 60px #0008}
    .hub h1{margin:0;text-align:center;font-size:34px}.sub{text-align:center;color:#aaa;margin:8px 0 26px}
    .games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .gameCard{border:1px solid #454545;border-radius:22px;padding:24px;background:linear-gradient(180deg,#171717,#0c0c0c);text-decoration:none;color:white;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
    .gameCard:hover{transform:translateY(-3px);border-color:#d0aa4b}
    .emoji{font-size:48px}.gameCard h2{font-size:26px;margin:10px 0}.gameCard p{color:#bbb;line-height:1.6}
    .enter{padding:12px 16px;border-radius:12px;font-weight:900;text-align:center;background:#278353}
    .big2 .enter{background:#3158a8}.footer{text-align:center;margin-top:20px;color:#777;font-size:12px}
    @media(max-width:700px){.games{grid-template-columns:1fr}.hub{padding:20px}}
  .maintenanceDiary{margin-top:28px;padding:20px 22px;border:1px solid #343434;border-radius:18px;background:#121212;text-align:left}.maintenanceDiary h2{margin:0 0 14px;color:#ffd45b}.maintenanceEntry{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid #292929;line-height:1.55}.maintenanceEntry time{color:#aaa}.maintenanceEntry span{color:#eee}.maintenanceSign{margin-top:15px;text-align:right;color:#aaa;font-weight:700}@media(max-width:640px){.maintenanceEntry{grid-template-columns:1fr;gap:3px}}
    .maintenanceHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
    #maintenanceChannelBtn{border:1px solid #66551f;background:#2a2412;color:#ffd45b;border-radius:10px;padding:8px 13px;font-weight:900;cursor:pointer}
    #maintenanceChannelBtn:hover{background:#3a3117}
    .maintenanceModal{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:rgba(0,0,0,.72);padding:18px}
    .maintenanceModal.hidden{display:none}
    .maintenanceModalCard{position:relative;width:min(92vw,520px);padding:24px;border:1px solid #4b4b4b;border-radius:18px;background:#151515;box-shadow:0 20px 60px rgba(0,0,0,.55)}
    .maintenanceModalCard h2{margin:0 0 8px;color:#ffd45b}.maintenanceModalCard p{color:#aaa}
    .maintenanceModalCard label{display:block;margin:12px 0 5px;font-weight:800}
    .maintenanceModalCard input,.maintenanceModalCard textarea{width:100%;box-sizing:border-box;border:1px solid #444;border-radius:10px;background:#0d0d0d;color:#fff;padding:10px 12px;font:inherit}
    .maintenanceModalCard textarea{resize:vertical}
    .maintenanceClose{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#bbb;font-size:26px;cursor:pointer}
    .maintenanceSave{width:100%;margin-top:14px;border:0;border-radius:11px;background:#278353;color:white;padding:11px;font-weight:900;cursor:pointer}
    .maintenanceMessage{min-height:22px;margin-top:10px;color:#ffcf69}

    .maintenanceEntry.latestOnly{
      display:block;
      padding:14px 0;
    }
    .maintenanceMeta{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:8px;
    }
    .maintenanceVersion{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:58px;
      padding:4px 9px;
      border-radius:999px;
      background:#2b2514;
      border:1px solid #66551f;
      color:#ffd45b;
      font-weight:900;
    }
    .maintenanceSummary{
      display:block;
      color:#eee;
      line-height:1.6;
    }
</style>
</head>
<body>
  <main class="hub">
    <h1>🃏 Card Game Hub</h1>
    <div class="sub">選擇要玩的遊戲，同一個網址、同一個多人房間系統。</div>
    <section class="games">
      <a class="gameCard" href="/liar.html">
        <div>
          <div class="emoji">🐶🎴</div>
          <h2>動物吹牛</h2>
        </div>
        <div class="enter">進入動物吹牛</div>
      </a>
      <a class="gameCard big2" href="/big2.html">
        <div>
          <div class="emoji">♠️♥️</div>
          <h2>大老二</h2>
        </div>
        <div class="enter">進入大老二</div>
      </a>
    </section>
    <section class="maintenanceDiary">
      <div class="maintenanceHead">
        <h2>🔧 維修日記</h2>
        <button id="maintenanceChannelBtn" type="button">維修通道</button>
      </div>

      <div id="maintenanceEntries">
        <div class="maintenanceEntry latestOnly">
          <div class="maintenanceMeta">
            <span class="maintenanceVersion">V5.40</span>
            <time>2026/08/24</time>
          </div>
          <span class="maintenanceSummary">
            吹牛排行榜加寬，玩家名稱至少可完整顯示三個中文字；其餘功能不變。
          </span>
        </div>
      </div>

      <div class="maintenanceSign">維修人員｜硯🦆</div>
    </section>

    <div id="maintenanceModal" class="maintenanceModal hidden">
      <div class="maintenanceModalCard">
        <button id="maintenanceClose" class="maintenanceClose" type="button">×</button>
        <h2>🔐 維修通道</h2>
        <p>輸入維修密碼後即可更新最新維修日記。</p>

        <label for="maintenancePassword">密碼</label>
        <input id="maintenancePassword" type="password" autocomplete="current-password" maxlength="32">

        <label for="maintenanceVersion">版本編號</label>
        <input id="maintenanceVersion" type="text" maxlength="16" placeholder="V5.40">

        <label for="maintenanceDate">日期</label>
        <input id="maintenanceDate" type="text" inputmode="numeric" placeholder="2026/08/24" maxlength="10">

        <label for="maintenanceContent">更新摘要</label>
        <textarea id="maintenanceContent" maxlength="240" rows="5" placeholder="輸入最新版本更新摘要"></textarea>

        <div id="maintenanceMessage" class="maintenanceMessage"></div>
        <button id="maintenanceSave" class="maintenanceSave" type="button">更新最新維修紀錄</button>
      </div>
    </div>

    <div id="maintenanceModal" class="maintenanceModal hidden">
      <div class="maintenanceModalCard">
        <button id="maintenanceClose" class="maintenanceClose" type="button">×</button>
        <h2>🔐 維修通道</h2>
        <p>輸入維修密碼後即可新增維修日記。</p>

        <label for="maintenancePassword">密碼</label>
        <input id="maintenancePassword" type="password" autocomplete="current-password" maxlength="32">

        <label for="maintenanceDate">日期</label>
        <input id="maintenanceDate" type="text" inputmode="numeric" placeholder="2026/08/24" maxlength="10">

        <label for="maintenanceContent">維修內容</label>
        <textarea id="maintenanceContent" maxlength="240" rows="5" placeholder="輸入本次維修的簡要內容"></textarea>

        <div id="maintenanceMessage" class="maintenanceMessage"></div>
        <button id="maintenanceSave" class="maintenanceSave" type="button">新增維修紀錄</button>
      </div>
    </div>
    <div class="footer">POWER by hhhyyy</div>
  </main>
  <script src="/maintenance.js?v=5.35"></script>
</body>
</html>
